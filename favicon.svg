<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .frame { fill: none; stroke: #1fa44c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .frame2 { fill: none; stroke: #157c38; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .gold { fill: none; stroke: #f0b429; stroke-width: 3; }
      .hub { fill: #f0b429; }
